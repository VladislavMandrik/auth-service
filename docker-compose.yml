version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: auth-service-db
    environment:
      POSTGRES_DB: usr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usr"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: auth-service-app
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: usr
      DB_USER: postgres
      DB_PASSWORD: 123
    depends_on:
      db:
        condition: service_healthy